[project]
name = "rag-app"
version = "0.2.0"
description = "Production-grade RAG application — FastAPI + Inngest + Qdrant + OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # Event-driven workflow
    "inngest>=0.5.18",
    # PDF parsing and chunking
    "llama-index-core>=0.14.22",
    "llama-index-readers-file>=0.6.0",
    # OpenAI (embeddings + LLM)
    "openai>=2.41.1",
    # Vector database
    "qdrant-client>=1.14.0",
    # Frontend
    "streamlit>=1.40.0",
    # Config management (pydantic-settings replaces manual os.getenv calls)
    "pydantic-settings>=2.4.0",
    # Env file loading
    "python-dotenv>=1.0.0",
    # HTTP client (used in streamlit polling loop)
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",      # for FastAPI TestClient
]
